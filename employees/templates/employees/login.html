<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Analytics Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, #07101d 0%, #020304 45%, #020304 100%);
            color: #e9edf5;
            font-family: 'Inter', sans-serif;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }
        .auth-shell {
            width: min(100%, 980px);
            background: rgba(7, 12, 23, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.45);
        }
        .auth-sidebar {
            background: linear-gradient(180deg, #06111c 0%, #08131f 100%);
            padding: 3rem 2.5rem;
            color: #cfd9ee;
        }
        .auth-sidebar h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }
        .auth-sidebar p {
            color: #94a3b8;
            line-height: 1.8;
        }
        .auth-form {
            padding: 3rem 2.75rem;
        }
        .auth-form h2 {
            font-size: 1.6rem;
            color: #f8fbff;
            margin-bottom: 0.5rem;
        }
        .auth-form p { color: #94a3b8; margin-bottom: 2rem; }
        .form-control {
            background: rgba(255,255,255,0.06) !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            color: #f8fbff !important;
            border-radius: 14px;
            padding: 0.95rem 1rem;
        }
        .form-control:focus {
            border-color: #33c2a3 !important;
            box-shadow: 0 0 0 4px rgba(51,194,163,0.12) !important;
        }
        .input-group-text {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: #94a3b8;
            border-radius: 14px 0 0 14px;
        }
        .btn-auth {
            width: 100%;
            border-radius: 14px;
            background: linear-gradient(135deg, #33c2a3, #0d6efd);
            border: none;
            color: #fff;
            padding: 0.95rem 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .btn-auth:hover { transform: translateY(-1px); }
        .password-field-wrapper { position: relative; }
        .password-toggle-btn {
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1rem;
            z-index: 2;
        }
        .auth-footer { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.25rem; margin-top: 1.5rem; color: #94a3b8; }
        .auth-footer a { color: #33c2a3; text-decoration: none; }
        @media (max-width: 991px) {
            .auth-shell { display: block; }
            .auth-sidebar, .auth-form { padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="auth-shell row g-0 overflow-hidden">
        <div class="col-md-5 auth-sidebar d-flex flex-column justify-content-center">
            <div>
                <h1>Matrix Login</h1>
                <p>Sign in to access the HR Analytics dashboard, manage employees, and track recoveries in a secure console.</p>
            </div>
            <div class="mt-auto auth-footer">
                <p>Need an account? <a href="#">Register now</a></p>
                
            </div>
        </div>
        <div class="col-md-7 auth-form">
            <h2>Sign In</h2>
            <p>Authorize your session using your user credentials.</p>
            <form method="POST" action="">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label text-white">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="mb-4 password-field-wrapper">
                    <label for="id_password" class="form-label text-white">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" class="password-toggle-btn"><i class="bi bi-eye-slash"></i></button>
                </div>
                <button type="submit" class="btn btn-auth">Authorize Access</button>
                <div class="auth-footer mt-4">
                    <p class="mb-0">Forgot your password? Contact your administrator.</p>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('id_password');
            const toggleBtn = document.querySelector('.password-toggle-btn');
            if (passwordInput && toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
                    } else {
                        passwordInput.type = 'password';
                        toggleBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
                    }
                });
            }
        });
    </script>
</body>
</html>
